<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<title>Atlas</title>
<link rel="stylesheet" href="launcher.css">
</head>
<body data-screen="home">
<header id="frame">
  <div class="top">
    <h1 id="title" role="button" tabindex="0" title="Home">Atlas</h1>
    <div class="meta" id="meta">Loading</div>
  </div>
  <div class="tools">
    <input type="search" id="q" placeholder="Find an app or file, or search Google" aria-label="Find an app or file, or search Google" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
    <div class="seg only-apps" id="views" role="group" aria-label="View"><button type="button" data-v="treemap" aria-pressed="true">Treemap</button><button type="button" data-v="tree" aria-pressed="false">Tree</button><button type="button" data-v="list" aria-pressed="false">List</button></div>
    <div class="seg only-apps" id="metric" role="group" aria-label="Sized by"><button type="button" data-m="use" aria-pressed="true">Use</button><button type="button" data-m="opens" aria-pressed="false">Opens</button><button type="button" data-m="eq" aria-pressed="false">Every app</button></div>
    <button type="button" class="tonebtn" id="tonebtn" title="Settings (hold: black or ivory)" aria-label="Settings. Hold to swap black and ivory."></button>
  </div>
  <nav class="crumbs only-apps" id="crumbs" aria-label="Where you are"></nav>
</header>

<main id="home" aria-label="Home">
  <button type="button" class="box apps top" id="box-apps" aria-label="Apps"><span class="lbl">Apps</span><span class="v" id="v-apps"></span></button>
  <button type="button" class="box files bottom" id="box-files" aria-label="Files"><span class="lbl">Files</span><span class="v" id="v-files"></span></button>
  <button type="button" class="hub" id="hub" aria-label="Dial. Tap to open or close it, hold to take names off it."><i></i></button>
</main>

<main id="apps" aria-label="Apps" hidden><div id="map" role="application" aria-label="Map of every app"></div></main>
<main id="settings" aria-label="Settings" hidden></main>
<section class="procs" id="procs" aria-label="Claude on your PC" hidden>
  <div class="phead"><button type="button" class="pgrab" id="p-grab" aria-label="Put away"></button><h2>Claude</h2><div class="meta" id="p-meta">Asking Atlas</div><button type="button" class="btn" id="p-pause" hidden>Pause all</button></div>
  <div class="pbody" id="p-body">
    <p class="pnone" id="p-empty">Asking Atlas</p>
    <div class="pmain" id="p-main" hidden>
      <p class="pstate" id="p-state" hidden></p>
      <div class="ptiles" id="p-tiles"></div>
      <section class="psec"><div class="psh"><h3>Usage</h3><div class="seg" id="p-metric" role="group" aria-label="Show"><button type="button" data-k="cpu" aria-pressed="true">CPU</button><button type="button" data-k="gpu" aria-pressed="false">GPU</button><button type="button" data-k="memPct" aria-pressed="false">Memory</button></div></div>
        <div class="pring" id="p-ring"></div><ul class="plegend" id="p-legend"></ul></section>
      <section class="psec"><div class="psh"><h3>Projects and requests</h3></div><div class="plist" id="p-list"></div><p class="pidle" id="p-idle" hidden></p></section>
    </div>
  </div>
</section>

<div class="dial" id="dial" hidden></div>
<div class="results" id="results" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" aria-live="polite"><button type="button" class="sheetx" id="sheetx">Close</button><div id="panel"></div></aside>
<div class="toast" id="toast" role="status" hidden></div>

<script src="launcher.js"></script>
</body>
</html>
